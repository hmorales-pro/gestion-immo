name: Tests

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  schedule:
    # Monthly run: catches a dependency or PHP change even when nobody touches the code.
    - cron: '17 6 1 * *'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']

    name: PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, pdo_sqlite, gd
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: vendor/bin/phpunit --display-deprecations --display-warnings

      - name: Security audit
        run: composer audit
