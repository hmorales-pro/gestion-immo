name: Tests

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  schedule:
    # Monthly run: catches a dependency or PHP change even when nobody touches the code.
    - cron: '17 6 1 * *'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']

    name: PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, pdo_sqlite, gd
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: vendor/bin/phpunit --display-deprecations --display-warnings

      - name: Security audit
        run: composer audit

  # Same install as on the shared host (no dev dependencies, cached config), then
  # every public page is requested. Catches a package that only dev installs provide.
  production:
    runs-on: ubuntu-latest
    name: Production install (PHP 8.5)

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, pdo_sqlite, gd
          coverage: none

      - name: Install production dependencies only
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress --prefer-dist

      - name: Configure like the shared host
        run: |
          cp .env.mutualise.example .env
          sed -i 's#^APP_URL=.*#APP_URL=https://booking.example.fr#' .env
          sed -i 's/^DB_CONNECTION=mysql/DB_CONNECTION=sqlite/' .env
          sed -i "s#^DB_DATABASE=.*#DB_DATABASE=$PWD/database/database.sqlite#" .env
          sed -i 's/^MAIL_MAILER=brevo/MAIL_MAILER=log/' .env
          sed -i 's/^IMMOBOOKING_WEBSITE=false/IMMOBOOKING_WEBSITE=true/; s/^IMMOBOOKING_DEMO=false/IMMOBOOKING_DEMO=true/' .env
          touch database/database.sqlite
          php artisan key:generate --force
          php artisan migrate --force
          php artisan config:cache && php artisan route:cache && php artisan view:cache

      - name: Every page answers
        run: php artisan immobooking:check
